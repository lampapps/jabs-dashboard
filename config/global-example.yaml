# =============================================================================
# JABS (Just Another Backup System) Dashboard Configuration Example
# =============================================================================
# Copy this file to 'global.yaml' and customize for your environment.

# --- Dashboard Configuration ---
# Configure what storage locations appear in the dashboard

# Network drives and mount points to display storage usage
drives:
  - path: "/"                          # Root filesystem
    label: "Root"
  - path: "/mnt/backup-drive"           # Example: External backup drive
    label: "Backup Drive"
# - path: "/mnt/nas"                    # Example: Network attached storage
#   label: "NAS Storage"

# S3 buckets to monitor (requires valid AWS CLI installed and credentialed
# Remove or comment out if not using S3
s3_buckets:
  - bucket: "example-jabs"              # Replace with your actual S3 bucket names
    label: "JABS"
  - bucket: "example-backup"
    label: "Backup"
# - bucket: "company-archive"           # Example: Long-term archive bucket
#   label: "Archive"

# --- Email Notification Configuration ---
# Configure SMTP email notifications for backup events
# Requires JABS_SMTP_USER and JABS_SMTP_PASS environment variables in .env file

email:
  smtp_server: "smtp.zoho.com"         # SMTP server hostname
                                      # Common examples:
                                      # Gmail: smtp.gmail.com
                                      # Outlook: smtp-mail.outlook.com  
                                      # Yahoo: smtp.mail.yahoo.com
                                      # Zoho: smtp.zoho.com
  smtp_port: 587                      # SMTP port number
                                      # 587 = TLS (recommended for most providers)
                                      # 465 = SSL, 25 = unencrypted (not recommended)
  to_addrs:                           # List of email addresses to receive notifications
    - "admin@example.com"             # Replace with actual email addresses
    - "backup-admin@company.com"       # Add multiple recipients as needed
#   - "it-team@example.com"           # Uncomment and modify as needed
  use_tls: true                       # true | false - Use TLS encryption
                                      # Recommended: true for security

  # The dashboard sends one digest email summarizing backup activity (successes
  # and failures) across all registered agents. Sending is checked/triggered by
  # scheduler.py -- see README.md for the recommended crontab entry. Per-event
  # immediate notifications (error/backup_complete) are sent by each backup
  # agent itself, configured in that agent's own config/global.yaml.

  # Periodic digest email schedule, evaluated every time scheduler.py runs.
  # schedule is a standard 5-field cron expression (minute hour day month
  # weekday) -- the digest is sent once its next scheduled fire time (since
  # the last send) has passed.
  digest:
    enabled: true                     # true | false - Enable/disable the digest email entirely
    schedule: "0 8 * * *"             # Example: daily at 8 AM

  # Immediate alert email sent the moment an enabled agent's grace period
  # (configured per-agent on the Agents page) lapses without a heartbeat/
  # event. Checked every time scheduler.py runs -- no cron schedule needed
  # since it only fires once per offline streak per agent.
  offline_alert:
    enabled: true                     # true | false - Enable/disable offline agent alerts

# --- Retention Configuration ---
# Universal retention window applied to ALL agents' data on the dashboard,
# regardless of any retention/rotation setting configured on an individual
# agent. Once a backup_jobs record's completion time is older than
# max_days, it (and its cascaded events) is purged from the dashboard's
# database. Checked/purged every time scheduler.py runs -- see README.md for
# the recommended crontab entry.
retention:
  max_days: 30                        # Days of completed job history to keep, across all agents

